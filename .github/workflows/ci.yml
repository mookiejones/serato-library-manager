name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Typecheck Python
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install pyright==1.1.407
          python -m pyright waveform.py waveform_native.py tests/test_waveform.py

      # Exercises bash plus the RELEASE_TAG environment path on the Windows
      # runner. The release job reads the tag from that variable because
      # PowerShell once expanded the shell form of the ref name to an empty
      # string (issue 48). No tag is passed on the command line.
      - name: Exercise the release tag check
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          RELEASE_TAG: v0.0.0
        run: python scripts/release_bundle.py check-tag

      - name: Run the suite
        run: python -m unittest discover -s tests -t . -v

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck the page
        run: npx tsc --noEmit && npx tsc --noEmit -p e2e

      - name: Reject any
        run: npx eslint src e2e

      - name: Test the page
        run: npm test

      - name: Rebuild the page and fail if the bundle is stale
        run: node scripts/build_frontend.mjs --check

      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Screenshot the waveform
        run: npx playwright test -c e2e/playwright.config.ts

      - name: Upload waveform screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waveform-screenshots-${{ runner.os }}
          path: e2e/output/
          if-no-files-found: error

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Audit pinned requirements
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --requirement requirements.txt --requirement requirements-build.txt --vulnerability-service osv
