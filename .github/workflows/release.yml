name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "serato-library.spec"
      - "scripts/release_*"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.artifact }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            kind: dmg
            artifact: Serato-Library-macos-arm64.dmg
          - runner: macos-15-intel
            arch: x64
            kind: dmg
            artifact: Serato-Library-macos-x64.dmg
          - runner: windows-latest
            arch: x64
            kind: windows
            artifact: Serato-Library-windows.zip
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-macos.txt

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Install macOS tray frameworks
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-macos.txt

      - name: Build the app
        run: python -m PyInstaller serato-library.spec

      - name: Require the frozen architecture
        shell: bash
        run: python scripts/release_bundle.py assert-arch dist "${{ matrix.arch }}"

      # No secrets are passed. The script prints "Signing skipped" and exits 0.
      - name: Skip signing on a pull request
        shell: bash
        run: python scripts/release_sign.py dist

      - name: Verify, write, and launch the disk image
        if: matrix.kind == 'dmg'
        shell: bash
        run: python scripts/release_bundle.py pack-dmg dist "${{ matrix.artifact }}" "${{ matrix.arch }}"

      - name: Verify, zip, and launch the portable build
        if: matrix.kind == 'windows'
        shell: bash
        run: python scripts/release_bundle.py pack dist Serato-Library-windows.zip

      - name: Install Inno Setup 6.7.3
        if: matrix.kind == 'windows'
        shell: bash
        run: python scripts/release_bundle.py install-inno

      - name: Build the Windows installer
        if: matrix.kind == 'windows'
        shell: bash
        run: python scripts/release_bundle.py build-setup dist Serato-Library-windows-setup.exe

      - name: Skip installer signing on a pull request
        if: matrix.kind == 'windows'
        shell: bash
        run: python scripts/release_sign.py Serato-Library-windows-setup.exe

      - name: Install the Windows installer and smoke it
        if: matrix.kind == 'windows'
        shell: bash
        run: python scripts/release_bundle.py smoke-setup Serato-Library-windows-setup.exe

  # Tag pushes and manual runs only. actions: write is required to upload
  # the built files so a later job can download them. A pull request never
  # runs this job, so that scope never appears on a pull_request token.
  release-build:
    name: release-build (${{ matrix.artifact }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            kind: dmg
            artifact: Serato-Library-macos-arm64.dmg
          - runner: macos-15-intel
            arch: x64
            kind: dmg
            artifact: Serato-Library-macos-x64.dmg
          - runner: windows-latest
            arch: x64
            kind: windows
            artifact: Serato-Library-windows.zip
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-macos.txt

      - name: Require a release tag
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_bundle.py check-tag

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Install macOS tray frameworks
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-macos.txt

      - name: Bake telemetry keys
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        shell: bash
        run: python scripts/write_build_config.py

      - name: Build the app
        run: python -m PyInstaller serato-library.spec

      - name: Require the frozen architecture
        shell: bash
        run: python scripts/release_bundle.py assert-arch dist "${{ matrix.arch }}"

      - name: Sign the macOS app when secrets are present
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python scripts/release_sign.py dist

      - name: Sign the Windows app when secrets are present
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: python scripts/release_sign.py dist

      - name: Verify, write, and launch the disk image
        if: matrix.kind == 'dmg'
        shell: bash
        run: python scripts/release_bundle.py pack-dmg dist "${{ matrix.artifact }}" "${{ matrix.arch }}"

      - name: Verify, zip, and launch the portable build
        if: matrix.kind == 'windows'
        shell: bash
        run: python scripts/release_bundle.py pack dist Serato-Library-windows.zip

      - name: Install Inno Setup 6.7.3
        if: matrix.kind == 'windows'
        shell: bash
        run: python scripts/release_bundle.py install-inno

      - name: Build the Windows installer
        if: matrix.kind == 'windows'
        shell: bash
        run: python scripts/release_bundle.py build-setup dist Serato-Library-windows-setup.exe

      - name: Sign the installer when secrets are present
        if: matrix.kind == 'windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: python scripts/release_sign.py Serato-Library-windows-setup.exe

      - name: Install the Windows installer and smoke it
        if: matrix.kind == 'windows'
        shell: bash
        run: python scripts/release_bundle.py smoke-setup Serato-Library-windows-setup.exe

      - name: Upload the disk image
        if: matrix.kind == 'dmg'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload the portable zip
        if: matrix.kind == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Serato-Library-windows.zip
          path: Serato-Library-windows.zip
          if-no-files-found: error

      - name: Upload the Windows installer
        if: matrix.kind == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Serato-Library-windows-setup.exe
          path: Serato-Library-windows-setup.exe
          if-no-files-found: error

  attest:
    name: attest build provenance
    needs: release-build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Serato-Library-*
          path: dist-zips
          merge-multiple: true

      - name: Attest the disk images and Windows files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-zips/Serato-Library-*

  publish:
    name: publish GitHub release
    needs: attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Require a release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_bundle.py check-tag

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Serato-Library-*
          path: dist-zips
          merge-multiple: true

      - name: Check the release files
        run: python scripts/release_bundle.py check-binaries dist-zips

      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh attestation verify dist-zips/Serato-Library-macos-arm64.dmg --repo "$RELEASE_REPO"
          gh attestation verify dist-zips/Serato-Library-macos-x64.dmg --repo "$RELEASE_REPO"
          gh attestation verify dist-zips/Serato-Library-windows-setup.exe --repo "$RELEASE_REPO"
          gh attestation verify dist-zips/Serato-Library-windows.zip --repo "$RELEASE_REPO"

      - name: Write and check SHA256SUMS
        run: |
          python scripts/release_bundle.py write-checksums dist-zips
          python scripts/release_bundle.py check-checksums dist-zips

      - name: Attest SHA256SUMS
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-zips/SHA256SUMS

      - name: Verify the checksum attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if gh attestation verify dist-zips/SHA256SUMS --repo "$RELEASE_REPO"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Refusing to replace it."
            exit 1
          fi
          mapfile -t flags < <(python scripts/release_bundle.py release-flags)
          gh release create "$RELEASE_TAG" \
            dist-zips/Serato-Library-macos-arm64.dmg \
            dist-zips/Serato-Library-macos-x64.dmg \
            dist-zips/Serato-Library-windows-setup.exe \
            dist-zips/Serato-Library-windows.zip \
            dist-zips/SHA256SUMS \
            "${flags[@]}" \
            --title "$RELEASE_TAG" --generate-notes --verify-tag
          python scripts/release_bundle.py footer "$RELEASE_REPO" > notes-footer.md
          gh release view "$RELEASE_TAG" --json body --jq .body > notes-body.md
          printf '\n' >> notes-body.md
          cat notes-footer.md >> notes-body.md
          gh release edit "$RELEASE_TAG" --notes-file notes-body.md
