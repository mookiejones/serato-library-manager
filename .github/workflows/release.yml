name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.zip }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            zip: Serato-Library-macos.zip
          - runner: windows-latest
            zip: Serato-Library-windows.zip
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a release tag
        if: github.event_name == 'push'
        shell: bash
        run: python scripts/release_bundle.py check-tag "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Bake telemetry keys
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        shell: bash
        run: python scripts/write_build_config.py

      - name: Build the app
        run: python -m PyInstaller serato-library.spec

      - name: Verify, zip, and launch the bundle
        run: python scripts/release_bundle.py pack dist "${{ matrix.zip }}"

      - name: Attest the zip
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.zip }}

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a release tag
        shell: bash
        run: python scripts/release_bundle.py check-tag "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download the zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Serato-Library-*
          path: dist-zips
          merge-multiple: true

      - name: Check the zips
        run: python scripts/release_bundle.py check-zips dist-zips

      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh attestation verify dist-zips/Serato-Library-macos.zip --repo "${GITHUB_REPOSITORY}"
          gh attestation verify dist-zips/Serato-Library-windows.zip --repo "${GITHUB_REPOSITORY}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Refusing to replace it."
            exit 1
          fi
          gh release create "$tag" dist-zips/*.zip --title "$tag" --generate-notes --verify-tag
          python scripts/release_bundle.py footer "${GITHUB_REPOSITORY}" > notes-footer.md
          gh release view "$tag" --json body --jq .body > notes-body.md
          printf '\n' >> notes-body.md
          cat notes-footer.md >> notes-body.md
          gh release edit "$tag" --notes-file notes-body.md
